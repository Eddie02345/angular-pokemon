<section class="region-section">
  <div class="section-header">
    <div>
      <h2 class="region-title">Hoenn Region</h2>
      <p class="region-description">
        Silver Conference Gym Leaders, specialty types, and battle rosters.
      </p>
    </div>

    <span class="region-badge region-badge-johto">
      8 Sanctioned Gyms
    </span>
  </div>

  <div class="panels-grid">
    @for (item of hoennLeaders(); track item.name) {
      <article class="gym-panel">
        <div class="panel-header">
          <div>
            <div class="header-line">
              <h3 class="leader-name">{{ item.name }}</h3>
            </div>

            <p class="gym-location">{{ item.town }}</p>
          </div>

          <div class="badge-tag">
            {{ item.badge }}
          </div>
        </div>

        <div class="team-container">
          <span class="label">Specialty</span>
          <p class="team-roster">{{ item.specialty }}</p>
        </div>

        <div class="team-container">
          <span class="label">Pokémon Team</span>
          <p class="team-roster">{{ item.pokemonTeam }}</p>
        </div>
      </article>
    }
  </div>
</section>
